<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Confirm your account deletion request</title>
  </head>
  <body style="font-family: Arial, sans-serif; color: #222; line-height: 1.6">
    <p>Hi {{firstName}},</p>
    <p>
      We received a request to delete your TheOtherWife account. Use this
      code to confirm it's really you:
    </p>
    <p style="font-size: 32px; font-weight: bold; letter-spacing: 4px">
      {{otpCode}}
    </p>
    <p>This code expires in 10 minutes.</p>
    <p>
      If you did not request this, you can safely ignore this email — your
      account will not be affected.
    </p>
  </body>
</html>
