map $http_upgrade $staging_connection_upgrade {
    default upgrade;
    ''      close;
}

# Staging API (e.g. staging-api.theotherwife.com) -> staging container on
# 127.0.0.1:8001. Same proxy headers as production so req.ip (used by partner
# IP allow-lists) is the real client address.
server {
    listen 80;
    listen [::]:80;
    server_name staging.your.domain.com;

    location / {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $staging_connection_upgrade;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
